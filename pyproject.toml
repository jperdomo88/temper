[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tao-spec"
version = "0.12.0"
description = "Reference validator for TAO — a behavioral audit interface for agentic AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jorge Perdomo", email = "jorgeperdom@gmail.com" }]
keywords = ["ai", "audit", "agents", "agentic", "observability", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/jperdomo88/tao"
Documentation = "https://github.com/jperdomo88/tao/tree/main/spec"
Issues = "https://github.com/jperdomo88/tao/issues"

[project.scripts]
tao = "tao.cli:main"

[tool.setuptools.packages.find]
include = ["tao*"]

[tool.setuptools.package-data]
tao = ["data/*.json"]
